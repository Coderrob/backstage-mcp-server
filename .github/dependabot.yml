version: 2

multi-ecosystem-groups:
  all-dependencies:
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 12
      semver-major-days: 30
      semver-minor-days: 12
      semver-patch-days: 7
    commit-message:
      prefix: deps
      include: scope

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: all-dependencies
    cooldown:
      default-days: 12
    commit-message:
      prefix: deps
      include: scope
