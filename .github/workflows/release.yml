name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.4.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Verify tag starts with package version
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          VERSION_TAG="v${PACKAGE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$VERSION_TAG" ]]; then
            SHA_PREFIX="${GITHUB_REF_NAME#${VERSION_TAG}_}"
            COMMIT_SHA="$(git rev-parse HEAD)"
            if [[ "$GITHUB_REF_NAME" != "${VERSION_TAG}_"* ||
                  ! "$SHA_PREFIX" =~ ^[0-9a-f]{7,64}$ ||
                  "$COMMIT_SHA" != "$SHA_PREFIX"* ]]; then
              echo "::error::Release tag must be ${VERSION_TAG} or ${VERSION_TAG}_<commit SHA prefix> (received ${GITHUB_REF_NAME})."
              exit 1
            fi
          fi

      - name: Run linting
        run: yarn lint

      - name: Type-check production and tests
        run: yarn typecheck

      - name: Validate source architecture
        run: yarn architecture:check

      - name: Reject unused files, exports, and dependencies
        run: yarn knip

      - name: Run tests
        run: yarn test

      - name: Test shell scripts with BATS
        run: yarn test:shell

      - name: Test packaged MCP server
        run: yarn test:mcp

      - name: Validate generated manifest
        run: yarn manifest:check

      - name: Validate build outputs
        run: yarn build:validate

      - name: Publish package
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "Release $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
