name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          registry-url: "https://registry.npmjs.org"

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.4.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run linting
        run: yarn lint

      - name: Type-check production and tests
        run: yarn typecheck

      - name: Validate source architecture
        run: yarn architecture:check

      - name: Reject unused files, exports, and dependencies
        run: yarn knip

      - name: Run tests
        run: yarn test

      - name: Test shell scripts with BATS
        run: yarn test:shell

      - name: Build the project
        run: yarn build

      - name: Validate generated manifest
        run: yarn manifest:check

      - name: Test MCP stdio protocol with the SDK and Inspector
        run: |
          yarn test:cli
          yarn test:inspector

      - name: Validate build outputs
        run: yarn build:validate

      - name: Validate CommonJS library entry
        run: node -e "const api = require('./dist/index.cjs'); if (typeof api.createMcpServer !== 'function') process.exit(1)"

      - name: Validate ESM library entry
        run: node --input-type=module -e "import * as api from './dist/index.mjs'; if (typeof api.createMcpServer !== 'function') process.exit(1)"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-artifacts-node-24
          path: |
            dist/
            !dist/**/*.map
          retention-days: 7

      - name: Upload coverage
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: coverage

  publish-test:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Activate pinned Yarn
        run: |
          corepack enable
          corepack install --global yarn@4.4.0

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build the project
        run: yarn build

      - name: Verify package contents
        run: npm pack --dry-run

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
